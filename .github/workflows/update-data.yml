name: Update Data

on:
  workflow_dispatch: {}
  # NOTE: GitHub auto-disables `schedule` triggers after 60 days with no repository
  # activity, and bot-authored GITHUB_TOKEN pushes (like the commit below) are widely
  # reported not to reset that clock. Since this repo also hosts the iOS app's source,
  # ordinary development commits keep the clock reset in practice — but if data ever
  # looks stale, check whether the schedule silently disabled (Settings > Actions > this
  # workflow) before assuming the data is just old.
  schedule:
    - cron: '0 0 */2 * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install webp
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Run update-data.sh
        run: ./update-data.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Update card/skill data from upstream"
            git push
          else
            echo "No changes to commit."
          fi
